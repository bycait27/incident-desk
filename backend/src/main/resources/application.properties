spring.application.name=incidentdesk

# Server Port
server.port=8080

# PostgreSQL Database Connection
spring.datasource.url=jdbc:postgresql://localhost:5432/incident_desk
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Flyway Migration Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.target=${FLYWAY_TARGET:latest}

# MCP authorization server and protected backend endpoints
app.mcp.oauth.enabled=${MCP_OAUTH_ENABLED:false}
app.mcp.oauth.issuer=${MCP_OAUTH_ISSUER:http://localhost:8080}
app.mcp.oauth.client-id=${MCP_OAUTH_CLIENT_ID:campuspulse-mcp}
app.mcp.oauth.redirect-uris=${MCP_OAUTH_REDIRECT_URIS:http://localhost:6274/oauth/callback,http://127.0.0.1:6274/oauth/callback}
app.mcp.oauth.signing-jwk-base64=${MCP_SIGNING_JWK_BASE64:}
app.mcp.oauth.client-origin=${MCP_OAUTH_CLIENT_ORIGIN:http://localhost:6274}
app.mcp.resource-url=${MCP_RESOURCE_URL:http://localhost:3001/mcp}

# Google OIDC login is disabled until server-side credentials are configured.
app.oauth.google.enabled=${GOOGLE_OAUTH_ENABLED:false}
app.oauth.google.client-id=${GOOGLE_CLIENT_ID:}
app.oauth.google.client-secret=${GOOGLE_CLIENT_SECRET:}
app.oauth.google.operator-subject=${GOOGLE_OPERATOR_SUBJECT:}
app.oauth.google.success-url=${FRONTEND_URL:http://localhost:5173}/?login=success
app.cors.allowed-origin=${FRONTEND_URL:http://localhost:5173}

# Better Stack credentials are provided by the backend environment, never the frontend.
app.betterstack.api-token=${BETTERSTACK_API_TOKEN:}
app.betterstack.public-monitor-ids=${BETTERSTACK_PUBLIC_MONITOR_IDS:}