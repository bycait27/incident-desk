name: Railway rollback

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Railway environment to roll back
        type: choice
        options:
          - staging
          - production
        required: true
      service:
        description: Railway service to roll back
        type: choice
        options:
          - incident-desk-app
          - incident-desk-mcp
        required: true
      deployment_id:
        description: ID of a previous successful deployment that Railway can roll back to
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: incident-desk-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rollback:
    name: Roll back ${{ inputs.service }} in ${{ inputs.environment }}
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: ${{ inputs.environment }}
    steps:
      - name: Install Railway CLI
        run: npm install --global @railway/cli@5.75.0

      - name: Validate rollback target
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
          DEPLOYMENT_ID: ${{ inputs.deployment_id }}
          EXPECTED_ENVIRONMENT: ${{ inputs.environment }}
          EXPECTED_SERVICE: ${{ inputs.service }}
        run: |
          set -euo pipefail
          case "$EXPECTED_ENVIRONMENT" in
            staging|production) ;;
            *) echo "::error::Unsupported Railway environment"; exit 1 ;;
          esac
          case "$EXPECTED_SERVICE" in
            incident-desk-app|incident-desk-mcp) ;;
            *) echo "::error::Unsupported Railway service"; exit 1 ;;
          esac
          test -n "$DEPLOYMENT_ID"
          TARGET_JSON=$(railway api --compact \
            'query rollbackTarget($id: String!) { deployment(id: $id) { id projectId status canRollback service { name } environment { name } } }' \
            --raw-var "id=$DEPLOYMENT_ID")
          echo "$TARGET_JSON" | jq -e \
            --arg id "$DEPLOYMENT_ID" \
            --arg project_id "$RAILWAY_PROJECT_ID" \
            --arg environment "$EXPECTED_ENVIRONMENT" \
            --arg service "$EXPECTED_SERVICE" \
            '.data.deployment as $d
             | $d != null
             and $d.id == $id
             and $d.projectId == $project_id
             and $d.status == "SUCCESS"
             and $d.canRollback
             and $d.environment.name == $environment
             and $d.service.name == $service' > /dev/null

      - name: Roll back deployment
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          DEPLOYMENT_ID: ${{ inputs.deployment_id }}
        run: |
          set -euo pipefail
          RESULT=$(railway api --compact \
            'mutation rollbackDeployment($id: String!) { deploymentRollback(id: $id) }' \
            --raw-var "id=$DEPLOYMENT_ID")
          echo "$RESULT" | jq -e '.data.deploymentRollback == true' > /dev/null

      - name: Verify rolled-back service health
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
          APP_HEALTH_URL: ${{ vars.APP_HEALTH_URL }}
          MCP_HEALTH_URL: ${{ vars.MCP_HEALTH_URL }}
          EXPECTED_ENVIRONMENT: ${{ inputs.environment }}
          EXPECTED_SERVICE: ${{ inputs.service }}
          DEPLOYMENT_ID: ${{ inputs.deployment_id }}
        run: |
          set -euo pipefail
          if [[ "$EXPECTED_SERVICE" == "incident-desk-app" ]]; then
            HEALTH_URL="$APP_HEALTH_URL"
          else
            HEALTH_URL="$MCP_HEALTH_URL"
          fi
          test -n "$HEALTH_URL"
          curl --fail --retry 12 --retry-delay 5 --retry-connrefused --retry-all-errors \
            "${HEALTH_URL%/}/healthz"
          ACTIVE_DEPLOYMENT_ID=$(railway deployment list --json --limit 1 \
            --service "$EXPECTED_SERVICE" \
            --environment "$EXPECTED_ENVIRONMENT" \
            --project "$RAILWAY_PROJECT_ID" | jq -r '.[0].id // empty')
          test -n "$ACTIVE_DEPLOYMENT_ID"
          {
            echo "Environment: \`$EXPECTED_ENVIRONMENT\`"
            echo "Service: \`$EXPECTED_SERVICE\`"
            echo "Rollback target deployment ID: \`$DEPLOYMENT_ID\`"
            echo "Active deployment ID after rollback: \`$ACTIVE_DEPLOYMENT_ID\`"
            echo "Health check: passed"
          } >> "$GITHUB_STEP_SUMMARY"
