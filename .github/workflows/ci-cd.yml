name: IncidentDesk CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  backend-build-and-test:
    name: Backend (Java 21 / Spring Boot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    # Spins up a real PostgreSQL instance so Spring Boot context & Flyway migrations test cleanly
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: incident_desk
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and run tests with Maven
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/incident_desk
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres
        run: mvn -B verify

  frontend-build-and-lint:
    name: Frontend (React / TypeScript / Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22.19
        uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check with TypeScript
        run: npm run typecheck

      - name: Lint frontend
        run: npm run lint

      - name: Test frontend states
        run: npm run test

      - name: Build production bundle
        run: npm run build

  mcp-build-and-test:
    name: MCP server and app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mcp

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22.19
        uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: 'npm'
          cache-dependency-path: mcp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test MCP authorization
        run: npm test

      - name: Build MCP server and app
        run: npm run build

  railway-iac-check:
    name: Railway infrastructure config
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22.19
        uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install infrastructure dependencies
        run: npm ci

      - name: Type-check Railway infrastructure
        run: npm run check:railway

  container-build:
    name: Build deployment containers
    runs-on: ubuntu-latest
    needs:
      - backend-build-and-test
      - frontend-build-and-lint
      - mcp-build-and-test
      - railway-iac-check

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build application image
        run: docker build --tag incident-desk-app:${{ github.sha }} .

      - name: Build MCP image
        run: docker build --tag incident-desk-mcp:${{ github.sha }} mcp

  deploy-staging:
    name: Deploy to staging
    runs-on: ubuntu-latest
    needs: container-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.RAILWAY_DEPLOY_ENABLED == 'true'
    environment: staging

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install --global @railway/cli@5.75.0

      - name: Deploy application to staging
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
        run: railway up "$GITHUB_WORKSPACE" --ci --project "$RAILWAY_PROJECT_ID" --environment staging --service incident-desk-app --message "github-sha=$GITHUB_SHA"

      - name: Deploy MCP service to staging
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
        run: railway up "$GITHUB_WORKSPACE/mcp" --ci --project "$RAILWAY_PROJECT_ID" --environment staging --service incident-desk-mcp --message "github-sha=$GITHUB_SHA"

      - name: Verify staging health
        env:
          APP_HEALTH_URL: ${{ vars.APP_HEALTH_URL }}
          MCP_HEALTH_URL: ${{ vars.MCP_HEALTH_URL }}
        run: |
          curl --fail --retry 12 --retry-delay 5 --retry-connrefused --retry-all-errors "${APP_HEALTH_URL%/}/healthz"
          curl --fail --retry 12 --retry-delay 5 --retry-connrefused --retry-all-errors "${MCP_HEALTH_URL%/}/healthz"

      - name: Record staging build identifiers
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
        run: |
          APP_DEPLOYMENT_ID=$(railway deployment list --json --limit 1 --service incident-desk-app --environment staging | jq -r '.[0].id // empty')
          MCP_DEPLOYMENT_ID=$(railway deployment list --json --limit 1 --service incident-desk-mcp --environment staging | jq -r '.[0].id // empty')
          test -n "$APP_DEPLOYMENT_ID"
          test -n "$MCP_DEPLOYMENT_ID"
          {
            echo "Staging commit: \`$GITHUB_SHA\`"
            echo "App deployment: \`$APP_DEPLOYMENT_ID\`"
            echo "MCP deployment: \`$MCP_DEPLOYMENT_ID\`"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-production:
    name: Promote tested commit to production
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.RAILWAY_DEPLOY_ENABLED == 'true'
    environment: production

    steps:
      - name: Checkout the same commit tested in staging
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install --global @railway/cli@5.75.0

      - name: Deploy application to production
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
        run: railway up "$GITHUB_WORKSPACE" --ci --project "$RAILWAY_PROJECT_ID" --environment production --service incident-desk-app --message "github-sha=$GITHUB_SHA"

      - name: Deploy MCP service to production
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
        run: railway up "$GITHUB_WORKSPACE/mcp" --ci --project "$RAILWAY_PROJECT_ID" --environment production --service incident-desk-mcp --message "github-sha=$GITHUB_SHA"

      - name: Verify production health
        env:
          APP_HEALTH_URL: ${{ vars.APP_HEALTH_URL }}
          MCP_HEALTH_URL: ${{ vars.MCP_HEALTH_URL }}
        run: |
          curl --fail --retry 12 --retry-delay 5 --retry-connrefused --retry-all-errors "${APP_HEALTH_URL%/}/healthz"
          curl --fail --retry 12 --retry-delay 5 --retry-connrefused --retry-all-errors "${MCP_HEALTH_URL%/}/healthz"

      - name: Record production build identifiers
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
        run: |
          APP_DEPLOYMENT_ID=$(railway deployment list --json --limit 1 --service incident-desk-app --environment production | jq -r '.[0].id // empty')
          MCP_DEPLOYMENT_ID=$(railway deployment list --json --limit 1 --service incident-desk-mcp --environment production | jq -r '.[0].id // empty')
          test -n "$APP_DEPLOYMENT_ID"
          test -n "$MCP_DEPLOYMENT_ID"
          {
            echo "Production commit: \`$GITHUB_SHA\`"
            echo "App deployment: \`$APP_DEPLOYMENT_ID\`"
            echo "MCP deployment: \`$MCP_DEPLOYMENT_ID\`"
          } >> "$GITHUB_STEP_SUMMARY"
